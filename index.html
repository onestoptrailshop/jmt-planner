<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JMT Resupply Planner — One Stop Trail Shop</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff; color: #1a1a1a; padding: 1.5rem; max-width: 700px; margin: 0 auto; }
.inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 1.5rem; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12px; font-weight: 500; color: #666; text-transform: uppercase; letter-spacing: 0.06em; }
.field input, .field select { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
.date-hint { font-size: 11px; color: #aaa; margin-top: 4px; }
.section-header { font-size: 12px; font-weight: 500; color: #666; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
.stop-toggles { display: flex; flex-direction: column; gap: 8px; margin-bottom: 1.5rem; }
.toggle-row { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 10px 12px; }
.toggle-row.disabled-stop { opacity: 0.45; }
.toggle-top { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.toggle-box { width: 18px; height: 18px; border: 1.5px solid #aaa; border-radius: 4px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.toggle-box.checked { background: #185FA5; border-color: #185FA5; }
.toggle-box.checked::after { content:''; display:block; width:5px; height:9px; border:2px solid #fff; border-top:none; border-left:none; transform:rotate(40deg) translateY(-1px); }
.toggle-name { font-size: 14px; color: #111; flex: 1; }
.toggle-miles { font-size: 12px; color: #666; text-align: right; line-height: 1.5; }
.toggle-side { font-size: 11px; color: #2563eb; margin-top: 2px; padding-left: 28px; }
.either-or { font-size: 11px; background: #fef3c7; color: #b45309; padding: 2px 7px; border-radius: 6px; flex-shrink: 0; }
.meal-toggles { display: flex; gap: 8px; margin-top: 8px; padding-left: 28px; flex-wrap: wrap; align-items: center; }
.meal-btn { font-size: 12px; padding: 3px 10px; border-radius: 6px; border: 1px solid #ddd; background: #f3f4f6; color: #666; cursor: pointer; user-select: none; }
.meal-btn.meal-on { background: #dcfce7; border-color: #86efac; color: #166534; }
.meal-btn.meal-locked { opacity: 0.4; cursor: default; }
.meal-label { font-size: 11px; color: #999; }
.vvr-toggle { display: flex; gap: 8px; margin-top: 8px; padding-left: 28px; flex-wrap: wrap; align-items: center; }
.vvr-btn { font-size: 12px; padding: 3px 10px; border-radius: 6px; border: 1px solid #ddd; background: #f3f4f6; color: #666; cursor: pointer; }
.vvr-btn.active { background: #185FA5; border-color: #185FA5; color: #fff; }
.vvr-warn { font-size: 11px; color: #b45309; margin-top: 4px; padding-left: 28px; }
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-bottom: 1rem; }
.metric { background: #f9fafb; border-radius: 10px; padding: 0.85rem 1rem; }
.metric-label { font-size: 11px; color: #666; margin-bottom: 4px; }
.metric-value { font-size: 20px; font-weight: 500; color: #111; }
.metric-sub { font-size: 11px; color: #aaa; margin-top: 2px; }
.warn-banner { background: #fffbeb; border: 1px solid #fcd34d; border-radius: 8px; padding: 8px 12px; font-size: 13px; color: #b45309; margin-bottom: 8px; }
.season-warn { background: #fff1f2; border: 1px solid #fda4af; border-radius: 8px; padding: 8px 12px; font-size: 13px; color: #be123c; margin-bottom: 8px; }
.box-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; margin-bottom: 10px; }
.box-card.warn-card { border-color: #fcd34d; }
.box-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: #f9fafb; border-bottom: 1px solid #e5e7eb; gap: 8px; flex-wrap: wrap; }
.box-header.warn-header { background: #fffbeb; }
.box-title { font-size: 14px; font-weight: 500; color: #111; }
.box-body { padding: 10px 14px; }
.box-row { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; border-bottom: 1px solid #f3f4f6; }
.box-row:last-child { border-bottom: none; }
.box-row span:first-child { color: #111; }
.box-row span:last-child { color: #666; font-size: 12px; }
.box-total { padding: 8px 14px; background: #f9fafb; border-top: 1px solid #e5e7eb; }
.box-total-main { display: flex; justify-content: space-between; font-size: 14px; font-weight: 500; color: #111; }
.box-total-note { font-size: 11px; color: #aaa; margin-top: 3px; }
.town-meal-note { color: #166534 !important; }
.cushion-note { color: #2563eb !important; }
.buffer-row { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-top: 1px solid #f3f4f6; background: #f9fafb; flex-wrap: wrap; }
.buffer-label { font-size: 12px; color: #666; flex: 1; }
.buffer-btns { display: flex; gap: 6px; }
.buf-btn { font-size: 12px; padding: 3px 10px; border-radius: 6px; border: 1px solid #ddd; background: #fff; color: #666; cursor: pointer; user-select: none; min-width: 32px; text-align: center; }
.buf-btn.active { background: #185FA5; border-color: #185FA5; color: #fff; font-weight: 500; }
.leg-divider { display: flex; align-items: center; gap: 8px; margin: 8px 0 4px; }
.leg-line { flex: 1; height: 1px; background: #e5e7eb; }
.leg-label { font-size: 11px; color: #aaa; white-space: nowrap; }
.leg-label.warn { color: #b45309; font-weight: 500; }
.start-banner { background: #f9fafb; border-radius: 8px; padding: 8px 12px; font-size: 12px; color: #666; margin-bottom: 1rem; }
.divider { height: 1px; background: #e5e7eb; margin: 1.25rem 0; }
.endpoint-meals { background: #f9fafb; border-radius: 10px; padding: 10px 14px; margin-bottom: 1rem; }
.endpoint-meals-title { font-size: 12px; font-weight: 500; color: #666; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
.endpoint-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 0; flex-wrap: wrap; }
.endpoint-label { font-size: 13px; color: #111; }
.action-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 1.5rem; }
.btn-primary { background: #185FA5; color: #fff; border: none; border-radius: 10px; padding: 10px 20px; font-size: 14px; font-weight: 500; cursor: pointer; flex: 1; min-width: 140px; }
.btn-secondary { background: #f9fafb; color: #111; border: 1px solid #ddd; border-radius: 10px; padding: 10px 20px; font-size: 14px; font-weight: 500; cursor: pointer; flex: 1; min-width: 140px; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 1rem; }
.modal { background: #fff; border-radius: 16px; padding: 1.5rem; max-width: 380px; width: 100%; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
.modal h3 { font-size: 16px; font-weight: 600; color: #111; margin-bottom: 8px; }
.modal p { font-size: 13px; color: #666; margin-bottom: 1rem; line-height: 1.5; }
.modal input[type="email"] { width: 100%; margin-bottom: 10px; padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
.modal-actions { display: flex; gap: 8px; }
.modal-actions .btn-primary, .modal-actions .btn-secondary { padding: 9px 16px; font-size: 13px; }
.modal-error { font-size: 12px; color: #c0392b; margin-bottom: 8px; display: none; }
</style>
</head>
<body>

<div class="inputs">
  <div class="field">
    <label>Start date</label>
    <input type="date" id="startDate" min="2027-07-01" max="2027-09-15">
    <div class="date-hint">2027 season: Jul 1 - Sep 15</div>
  </div>
  <div class="field">
    <label>Entry trailhead</label>
    <select id="entry">
      <option value="">Choose entry trailhead...</option>
    </select>
  </div>
  <div class="field">
    <label>Exit trailhead</label>
    <select id="exit">
      <option value="">Choose exit trailhead...</option>
    </select>
  </div>
  <div class="field">
    <label>Daily pace</label>
    <select id="pace">
      <option value="">Choose pace...</option>
      <option value="9">9 mi/day</option>
      <option value="10">10 mi/day</option>
      <option value="11">11 mi/day</option>
      <option value="12">12 mi/day</option>
      <option value="13">13 mi/day</option>
      <option value="14">14 mi/day</option>
      <option value="15">15 mi/day</option>
    </select>
  </div>
</div>

<div class="endpoint-meals">
  <div class="endpoint-meals-title">Meals at trailhead</div>
  <div class="endpoint-row">
    <span class="endpoint-label">Breakfast before leaving entry trailhead</span>
    <div class="meal-btn" id="entryBreakfastBtn" onclick="toggleEndpointMeal('entryBreakfast')">Buy on-site</div>
  </div>
  <div class="endpoint-row">
    <span class="endpoint-label">Dinner at exit trailhead</span>
    <div class="meal-btn" id="exitDinnerBtn" onclick="toggleEndpointMeal('exitDinner')">Buy on-site</div>
  </div>
</div>

<div class="divider"></div>
<div class="section-header">Resupply stops</div>
<div id="toggles"><p style="color:#aaa;font-size:13px;font-style:italic">Select entry and exit trailheads to see available resupply stops.</p></div>
<div class="divider"></div>
<div id="results"></div>

<div class="modal-overlay" id="modalOverlay" style="display:none">
  <div class="modal"><div id="modalContent"></div></div>
</div>

<script>
var CK_FORM_ID    = "YOUR_CK_FORM_ID_HERE";
var CK_API_KEY    = "YOUR_CK_API_KEY_HERE";
var FORMSPREE_URL = "YOUR_FORMSPREE_URL_HERE";

var SEASON_MIN = "2027-07-01";
var SEASON_MAX = "2027-09-15";
var MAX_TRAIL_DAYS = 7;

var TRAILHEADS = [
  { id:"HI",   name:"Happy Isles / Yosemite Valley", soboMile:0,     noboMile:210.5, sideTrip:0    },
  { id:"LC",   name:"Lyell Canyon",                  soboMile:24,    noboMile:187,   sideTrip:0.5  },
  { id:"NDVP", name:"JMT N of Devils Postpile",      soboMile:61,    noboMile:150,   sideTrip:0.5  },
  { id:"SDVP", name:"JMT S of Devils Postpile",      soboMile:61,    noboMile:150,   sideTrip:0.5  },
  { id:"RC",   name:"Red Cones",                     soboMile:63.7,  noboMile:146.8, sideTrip:3    },
  { id:"SC",   name:"Shadow Creek",                  soboMile:49.1,  noboMile:161.4, sideTrip:4.3  },
  { id:"DP",   name:"Duck Pass",                     soboMile:71.9,  noboMile:138.6, sideTrip:5.2  },
  { id:"RT",   name:"River Trail",                   soboMile:43.1,  noboMile:167.4, sideTrip:7.7  },
  { id:"HT",   name:"High Trail",                    soboMile:43.1,  noboMile:167.4, sideTrip:7.9  },
  { id:"RCR",  name:"Rush Creek",                    soboMile:40,    noboMile:170.5, sideTrip:8.7  },
  { id:"TP",   name:"Taboose Pass",                  soboMile:158,   noboMile:53,    sideTrip:9.4  },
  { id:"BX",   name:"Baxter Pass",                   soboMile:174,   noboMile:37,    sideTrip:11.2 },
  { id:"BP",   name:"Bishop Pass",                   soboMile:136,   noboMile:75,    sideTrip:11.8 },
  { id:"SW",   name:"Sawmill Pass",                  soboMile:165,   noboMile:46,    sideTrip:12.5 },
  { id:"MP",   name:"Mono Pass",                     soboMile:88.1,  noboMile:122.4, sideTrip:14.6 },
  { id:"PP",   name:"Piute Pass",                    soboMile:110,   noboMile:101,   sideTrip:15.6 },
  { id:"WP",   name:"Whitney Portal",                soboMile:210.5, noboMile:0,     sideTrip:11   },
  { id:"CL",   name:"Cottonwood Lakes",              soboMile:210.5, noboMile:0,     sideTrip:20   }
];

var RESUPPLY = [
  { id:"TM",  name:"Tuolumne Meadows",               soboMile:23,  noboMile:187, sideTrip:0,    hasMeals:true,  mtrLocked:false, eitherOr:null      },
  { id:"RM",  name:"Reds Meadow",                    soboMile:61,  noboMile:150, sideTrip:0,    hasMeals:true,  mtrLocked:false, eitherOr:null      },
  { id:"VVR", name:"Vermilion Valley Resort",        soboMile:88,  noboMile:122, sideTrip:4.5,  hasMeals:true,  mtrLocked:false, eitherOr:"VVR/MTR", vvrFerry:1, vvrHike:4.5 },
  { id:"MTR", name:"Muir Trail Ranch",               soboMile:106, noboMile:104, sideTrip:0,    hasMeals:false, mtrLocked:true,  eitherOr:"VVR/MTR" },
  { id:"PR",  name:"Parchers Resort",                soboMile:136, noboMile:74,  sideTrip:11.8, hasMeals:true,  mtrLocked:false, eitherOr:"PR/KS"   },
  { id:"KS",  name:"Kearsarge / MWM / Independence", soboMile:180, noboMile:30,  sideTrip:6.6,  hasMeals:true,  mtrLocked:false, eitherOr:"PR/KS"   }
];

var vvrMode = "hike";
var stopEnabled = { TM:true, RM:true, VVR:false, MTR:true, PR:false, KS:true };
var mealInBox   = { TM:{d:true,b:true}, RM:{d:true,b:true}, VVR:{d:true,b:true}, MTR:{d:true,b:true}, PR:{d:true,b:true}, KS:{d:true,b:true} };
var endpointMeals = { entryBreakfast:false, exitDinner:false };
var boxBuffers = {};
var currentPlan = null;

function addDays(d,n) {
  var x = new Date(d);
  x.setDate(x.getDate() + n);
  return x;
}

function fmtDate(d) {
  return d.toLocaleDateString("en-US", {month:"short", day:"numeric", year:"numeric"});
}

function getSideTrip(s) {
  if (s.id === "VVR") return vvrMode === "ferry" ? s.vvrFerry : s.vvrHike;
  return s.sideTrip || 0;
}

function getEntryVal() { return document.getElementById("entry").value; }
function getExitVal()  { return document.getElementById("exit").value; }

function getEntry() {
  var v = getEntryVal();
  if (!v) return null;
  for (var i = 0; i < TRAILHEADS.length; i++) {
    if (TRAILHEADS[i].id === v) return TRAILHEADS[i];
  }
  return null;
}

function getExit() {
  var v = getExitVal();
  if (!v) return null;
  for (var i = 0; i < TRAILHEADS.length; i++) {
    if (TRAILHEADS[i].id === v) return TRAILHEADS[i];
  }
  return null;
}

function isSOBO() {
  var en = getEntry(), ex = getExit();
  if (!en || !ex) return true;
  return en.soboMile <= ex.soboMile;
}

function getJmtMile(s) {
  return isSOBO() ? s.soboMile : s.noboMile;
}

function mealsForMiles(miles, pace) {
  if (miles <= 0) return 0;
  var exact = miles / pace;
  var whole = Math.floor(exact);
  var frac  = exact - whole;
  var extra = 0;
  if      (frac >= 0.8) extra = 3;
  else if (frac >= 0.5) extra = 2;
  else if (frac >= 0.3) extra = 1;
  return whole * 3 + extra;
}

function defaultBuffer(base) {
  return base <= 10 ? 1 : 2;
}

function populateSelectors() {
  var sorted = TRAILHEADS.slice().sort(function(a,b){ return a.soboMile - b.soboMile; });
  var entryEl = document.getElementById("entry");
  var exitEl  = document.getElementById("exit");
  entryEl.innerHTML = '<option value="">Choose entry trailhead...</option>';
  exitEl.innerHTML  = '<option value="">Choose exit trailhead...</option>';
  for (var i = 0; i < sorted.length; i++) {
    var t = sorted[i];
    var label = t.name + (t.sideTrip > 0 ? " (+" + t.sideTrip + "mi to JMT)" : "");
    var exitLabel = t.name + (t.sideTrip > 0 ? " (+" + t.sideTrip + "mi exit from JMT)" : "");
    entryEl.innerHTML += '<option value="' + t.id + '">' + label + '</option>';
    exitEl.innerHTML  += '<option value="' + t.id + '">' + exitLabel + '</option>';
  }
}

function getActiveStops() {
  var en = getEntry(), ex = getExit();
  if (!en || !ex || en.id === ex.id) return [];
  var sobo = isSOBO();
  var enMile = sobo ? en.soboMile : en.noboMile;
  var exMile = sobo ? ex.soboMile : ex.noboMile;
  var lo = Math.min(enMile, exMile);
  var hi = Math.max(enMile, exMile);
  var result = [];
  for (var i = 0; i < RESUPPLY.length; i++) {
    var s = RESUPPLY[i];
    var m = sobo ? s.soboMile : s.noboMile;
    if (m > lo && m < hi) result.push(s);
  }
  result.sort(function(a,b){ return sobo ? a.soboMile-b.soboMile : a.noboMile-b.noboMile; });
  return result;
}

function buildToggles() {
  var active = getActiveStops();
  var el = document.getElementById("toggles");
  if (!active.length) {
    el.innerHTML = '<p style="color:#aaa;font-size:13px;font-style:italic">Select entry and exit trailheads to see available resupply stops.</p>';
    return;
  }
  var html = "";
  for (var i = 0; i < active.length; i++) {
    var s   = active[i];
    var on  = stopEnabled[s.id];
    var st  = getSideTrip(s);
    var jmt = getJmtMile(s);
    html += '<div class="toggle-row' + (!on ? " disabled-stop" : "") + '">';
    html += '<div class="toggle-top" onclick="toggleStop(\'' + s.id + '\')">';
    html += '<div class="toggle-box' + (on ? " checked" : "") + '"></div>';
    html += '<div class="toggle-name">' + s.name + (s.eitherOr ? ' <span class="either-or">' + s.eitherOr + '</span>' : '') + '</div>';
    html += '<div class="toggle-miles">JMT mi ' + jmt + (st > 0 ? '<br><span style="color:#2563eb;font-size:11px">+' + st + 'mi side trip</span>' : '') + '</div>';
    html += '</div>';
    if (on && s.id === "VVR") {
      html += '<div class="vvr-toggle">';
      html += '<span class="meal-label">Getting there:</span>';
      html += '<div class="vvr-btn' + (vvrMode==="ferry" ? " active" : "") + '" onclick="setVvr(\'ferry\')">Ferry (1mi) - TBD</div>';
      html += '<div class="vvr-btn' + (vvrMode==="hike"  ? " active" : "") + '" onclick="setVvr(\'hike\')">Hike (4.5mi)</div>';
      html += '</div>';
      html += '<div class="vvr-warn">Ferry status unconfirmed - verify before relying on it</div>';
    }
    if (on && st > 0) {
      html += '<div class="toggle-side">Outbound miles: previous box - Return miles: this box</div>';
    }
    if (on && s.hasMeals) {
      html += '<div class="meal-toggles"><span class="meal-label">Buy on-site instead:</span>';
      html += '<div class="meal-btn' + (!mealInBox[s.id].d ? " meal-on" : "") + (s.mtrLocked ? " meal-locked" : "") + '" onclick="' + (s.mtrLocked ? "" : "toggleMeal('" + s.id + "','d')") + '">Dinner</div>';
      html += '<div class="meal-btn' + (!mealInBox[s.id].b ? " meal-on" : "") + (s.mtrLocked ? " meal-locked" : "") + '" onclick="' + (s.mtrLocked ? "" : "toggleMeal('" + s.id + "','b')") + '">Breakfast</div>';
      html += '</div>';
    }
    html += '</div>';
  }
  el.innerHTML = html;
}

function toggleStop(id) { stopEnabled[id] = !stopEnabled[id]; buildToggles(); render(); }
function toggleMeal(id, m) { mealInBox[id][m] = !mealInBox[id][m]; buildToggles(); render(); }
function setVvr(mode) { vvrMode = mode; buildToggles(); render(); }
function setBuffer(key, val) { boxBuffers[key] = val; render(); }

function toggleEndpointMeal(key) {
  endpointMeals[key] = !endpointMeals[key];
  var btnId = key === "entryBreakfast" ? "entryBreakfastBtn" : "exitDinnerBtn";
  var btn = document.getElementById(btnId);
  if (endpointMeals[key]) btn.classList.add("meal-on");
  else btn.classList.remove("meal-on");
  render();
}

function onRouteChange() { buildToggles(); render(); }

function computePlan() {
  var startVal = document.getElementById("startDate").value;
  var paceVal  = document.getElementById("pace").value;
  var en = getEntry(), ex = getExit();
  if (!startVal || !paceVal || !en || !ex || en.id === ex.id) return null;
  if (startVal < SEASON_MIN || startVal > SEASON_MAX) return null;

  var pace      = parseInt(paceVal);
  var sobo      = isSOBO();
  var startDate = new Date(startVal + "T12:00:00");
  var entryJmt  = sobo ? en.soboMile : en.noboMile;
  var exitJmt   = sobo ? ex.soboMile : ex.noboMile;
  var entryTrip = en.sideTrip;
  var exitTrip  = ex.sideTrip;
  var stops     = getActiveStops().filter(function(s){ return stopEnabled[s.id]; });

  var prevJmtMile = entryJmt;
  var cumMiles    = entryTrip;
  var boxes       = [];
  var prevBreakfastBoughtOnSite = false;

  for (var i = 0; i < stops.length; i++) {
    var s          = stops[i];
    var jmtMile    = getJmtMile(s);
    var trailMiles = Math.abs(jmtMile - prevJmtMile);
    var st         = getSideTrip(s);
    var prevReturn = i > 0 ? getSideTrip(stops[i-1]) : 0;
    var trailDays  = Math.ceil(trailMiles / pace);
    var boxMiles   = prevReturn + trailMiles + st;
    cumMiles      += prevReturn + trailMiles + st;
    var arrivalDay = Math.ceil(cumMiles / pace);

    var baseMeals = mealsForMiles(boxMiles, pace);
    var onSite = 0;
    if (i === 0 && endpointMeals.entryBreakfast) onSite++;
    if (!mealInBox[s.id].d) onSite++;
    if (prevBreakfastBoughtOnSite) onSite++;
    baseMeals = Math.max(0, baseMeals - onSite);

    var bufKey = String(i);
    if (boxBuffers[bufKey] === undefined) boxBuffers[bufKey] = defaultBuffer(baseMeals);
    var buffer     = boxBuffers[bufKey];
    var totalMeals = baseMeals + buffer;

    boxes.push({
      s: s, jmtMile: jmtMile, trailMiles: trailMiles, trailDays: trailDays,
      st: st, prevReturn: prevReturn, boxMiles: boxMiles,
      baseMeals: baseMeals, buffer: buffer, totalMeals: totalMeals,
      arrivalDay: arrivalDay, arrivalDate: addDays(startDate, arrivalDay - 1),
      dinnerIn: mealInBox[s.id].d,
      breakfastBoughtOnSite: !mealInBox[s.id].b,
      prevBreakfastBoughtOnSite: prevBreakfastBoughtOnSite,
      entryBreakfastDeducted: i === 0 && endpointMeals.entryBreakfast,
      fromLabel: i === 0 ? en.id : stops[i-1].id,
      fromName:  i === 0 ? en.name : stops[i-1].name,
      isFirst: i === 0, bufKey: bufKey
    });

    prevBreakfastBoughtOnSite = !mealInBox[s.id].b;
    prevJmtMile = jmtMile;
  }

  var lastReturn      = stops.length ? getSideTrip(stops[stops.length-1]) : 0;
  var finalTrailMiles = Math.abs(exitJmt - prevJmtMile);
  var finalBoxMiles   = lastReturn + finalTrailMiles + exitTrip;
  var finalTrailDays  = Math.ceil((finalTrailMiles + exitTrip) / pace);
  cumMiles           += lastReturn + finalTrailMiles + exitTrip;

  var finalBase = mealsForMiles(finalBoxMiles, pace);
  if (prevBreakfastBoughtOnSite) finalBase = Math.max(0, finalBase - 1);
  if (endpointMeals.exitDinner)  finalBase = Math.max(0, finalBase - 1);
  if (boxBuffers["final"] === undefined) boxBuffers["final"] = defaultBuffer(finalBase);
  var finalBuffer = boxBuffers["final"];
  var finalTotal  = finalBase + finalBuffer;

  var totalTrueMiles  = Math.round(cumMiles * 10) / 10;
  var totalDays       = Math.ceil(totalTrueMiles / pace);
  var endDate         = addDays(startDate, totalDays);
  var jmtMilesCovered = Math.abs(exitJmt - entryJmt);
  var serviceFee      = totalDays * 25;

  var warnings = [];
  for (var j = 0; j < boxes.length; j++) {
    if (boxes[j].trailDays > MAX_TRAIL_DAYS) {
      warnings.push(boxes[j].fromName + " to " + boxes[j].s.name + ": " + boxes[j].trailDays + " trail days (" + boxes[j].trailMiles + "mi) - consider adding a stop.");
    }
  }
  if (finalTrailDays > MAX_TRAIL_DAYS) {
    var fn = stops.length ? stops[stops.length-1].name : en.name;
    warnings.push(fn + " to " + ex.name + ": " + finalTrailDays + " days - may be a heavy carry.");
  }

  return {
    en: en, ex: ex, sobo: sobo, startDate: startDate, endDate: endDate,
    pace: pace, boxes: boxes, stops: stops,
    finalTrailMiles: finalTrailMiles, finalTrailDays: finalTrailDays,
    finalBoxMiles: finalBoxMiles, finalBase: finalBase,
    finalBuffer: finalBuffer, finalTotal: finalTotal,
    lastReturn: lastReturn, exitTrip: exitTrip, entryTrip: entryTrip,
    totalTrueMiles: totalTrueMiles, totalDays: totalDays,
    jmtMilesCovered: jmtMilesCovered, serviceFee: serviceFee,
    warnings: warnings, prevBreakfastBoughtOnSite: prevBreakfastBoughtOnSite,
    finalFromLabel: stops.length ? stops[stops.length-1].id : en.id,
    finalFromName:  stops.length ? stops[stops.length-1].name : en.name
  };
}

function bufBtns(key, current) {
  var html = "";
  for (var v = 0; v <= 3; v++) {
    html += '<div class="buf-btn' + (current === v ? " active" : "") + '" onclick="setBuffer(\'' + key + '\',' + v + ')">' + v + '</div>';
  }
  return html;
}

function render() {
  var el       = document.getElementById("results");
  var startVal = document.getElementById("startDate").value;

  if (startVal && (startVal < SEASON_MIN || startVal > SEASON_MAX)) {
    el.innerHTML = '<div class="season-warn">Please select a start date within the 2027 season: Jul 1 - Sep 15.</div>';
    return;
  }

  var plan = computePlan();
  currentPlan = plan;
  if (!plan) { el.innerHTML = ""; return; }

  var en = plan.en, ex = plan.ex, sobo = plan.sobo;
  var html = "";

  html += '<div class="start-banner"><strong>' + (sobo ? "SOBO" : "NOBO") + '</strong>: ' + en.name + ' to ' + ex.name + ' - ' + plan.jmtMilesCovered + ' JMT miles - ' + plan.totalTrueMiles + ' true miles</div>';
  html += '<div class="summary">';
  html += '<div class="metric"><div class="metric-label">JMT miles</div><div class="metric-value">' + plan.jmtMilesCovered + '</div><div class="metric-sub">trail only</div></div>';
  html += '<div class="metric"><div class="metric-label">True miles</div><div class="metric-value">' + plan.totalTrueMiles + '</div><div class="metric-sub">all segments</div></div>';
  html += '<div class="metric"><div class="metric-label">Trip length</div><div class="metric-value">' + plan.totalDays + ' days</div></div>';
  html += '<div class="metric"><div class="metric-label">Finish date</div><div class="metric-value">' + fmtDate(plan.endDate) + '</div></div>';
  html += '<div class="metric"><div class="metric-label">Service fee</div><div class="metric-value">$' + plan.serviceFee + '</div></div>';
  html += '</div>';

  for (var w = 0; w < plan.warnings.length; w++) {
    html += '<div class="warn-banner">' + plan.warnings[w] + '</div>';
  }

  if (plan.entryTrip > 0) {
    html += '<div class="leg-divider"><div class="leg-line"></div><div class="leg-label">Trailhead to JMT: ' + plan.entryTrip + 'mi - included in Box 1</div><div class="leg-line"></div></div>';
  }

  for (var i = 0; i < plan.boxes.length; i++) {
    var b    = plan.boxes[i];
    var warn = b.trailDays > MAX_TRAIL_DAYS;
    html += '<div class="leg-divider"><div class="leg-line"></div><div class="leg-label' + (warn ? " warn" : "") + '">' + b.fromLabel + ' to ' + b.s.id + ': ' + b.trailDays + ' trail days - ' + b.trailMiles + 'mi' + (warn ? ' !' : '') + '</div><div class="leg-line"></div></div>';
    html += '<div class="box-card' + (warn ? " warn-card" : "") + '">';
    html += '<div class="box-header' + (warn ? " warn-header" : "") + '">';
    html += '<div><div class="box-title">Box ' + (i+1) + ': ' + b.s.name + '</div><div style="font-size:12px;color:#666;margin-top:2px">Arrive Day ' + b.arrivalDay + ' - ' + fmtDate(b.arrivalDate) + '</div></div>';
    html += '</div>';
    html += '<div class="box-body">';
    if (b.isFirst && plan.entryTrip > 0) {
      html += '<div class="box-row"><span>Entry: ' + en.name + ' to JMT (' + plan.entryTrip + 'mi)</span><span>' + Math.ceil(plan.entryTrip/plan.pace) + ' day(s)</span></div>';
    }
    if (b.prevReturn > 0) {
      html += '<div class="box-row"><span>Return from previous side trip (' + b.prevReturn + 'mi)</span><span>' + Math.ceil(b.prevReturn/plan.pace) + ' day(s)</span></div>';
    }
    html += '<div class="box-row"><span>Trail: ' + b.fromLabel + ' to ' + b.s.id + ' (' + b.trailMiles + 'mi)</span><span>' + b.trailDays + ' day(s)</span></div>';
    if (b.st > 0) {
      html += '<div class="box-row"><span>Outbound to ' + b.s.name + ' (' + b.st + 'mi)</span><span>' + Math.ceil(b.st/plan.pace) + ' day(s)</span></div>';
    }
    if (b.entryBreakfastDeducted) {
      html += '<div class="box-row"><span>Breakfast at entry trailhead</span><span class="town-meal-note">-1 meal</span></div>';
    }
    if (!b.dinnerIn) {
      html += '<div class="box-row"><span>Dinner at ' + b.s.name + ' - purchased on-site</span><span class="town-meal-note">-1 meal</span></div>';
    }
    if (b.prevBreakfastBoughtOnSite) {
      html += '<div class="box-row"><span>Breakfast at ' + b.fromName + ' - purchased on-site</span><span class="town-meal-note">-1 meal</span></div>';
    }
    html += '</div>';
    html += '<div class="buffer-row"><span class="buffer-label">Trail buffer: <strong class="cushion-note">+' + b.buffer + ' meal(s)</strong></span><div class="buffer-btns">' + bufBtns(b.bufKey, b.buffer) + '</div></div>';
    html += '<div class="box-total"><div class="box-total-main"><span>' + b.totalMeals + ' meals total</span><span>' + b.boxMiles + 'mi</span></div><div class="box-total-note">' + b.baseMeals + ' calculated + ' + b.buffer + ' buffer</div></div>';
    html += '</div>';
  }

  var finalWarn = plan.finalTrailDays > MAX_TRAIL_DAYS;
  html += '<div class="leg-divider"><div class="leg-line"></div><div class="leg-label' + (finalWarn ? " warn" : "") + '">' + plan.finalFromLabel + ' to ' + ex.id + ': ' + plan.finalTrailDays + ' days - ' + Math.round((plan.finalTrailMiles + plan.exitTrip)*10)/10 + 'mi</div><div class="leg-line"></div></div>';
  html += '<div class="box-card' + (finalWarn ? " warn-card" : "") + '">';
  html += '<div class="box-header' + (finalWarn ? " warn-header" : "") + '"><div><div class="box-title">Final carry to ' + ex.name + '</div><div style="font-size:12px;color:#666;margin-top:2px">' + fmtDate(plan.endDate) + '</div></div></div>';
  html += '<div class="box-body">';
  if (plan.lastReturn > 0) {
    html += '<div class="box-row"><span>Return from previous side trip (' + plan.lastReturn + 'mi)</span><span>' + Math.ceil(plan.lastReturn/plan.pace) + ' day(s)</span></div>';
  }
  if (plan.finalTrailMiles > 0) {
    html += '<div class="box-row"><span>Trail to JMT exit junction (' + plan.finalTrailMiles + 'mi)</span><span>' + Math.ceil(plan.finalTrailMiles/plan.pace) + ' day(s)</span></div>';
  }
  if (plan.exitTrip > 0) {
    html += '<div class="box-row"><span>Exit: JMT to ' + ex.name + ' (' + plan.exitTrip + 'mi)</span><span>' + Math.ceil(plan.exitTrip/plan.pace) + ' day(s)</span></div>';
  }
  if (plan.prevBreakfastBoughtOnSite) {
    html += '<div class="box-row"><span>Breakfast at ' + plan.finalFromName + ' - purchased on-site</span><span class="town-meal-note">-1 meal</span></div>';
  }
  if (endpointMeals.exitDinner) {
    html += '<div class="box-row"><span>Dinner at exit trailhead</span><span class="town-meal-note">-1 meal</span></div>';
  }
  html += '</div>';
  html += '<div class="buffer-row"><span class="buffer-label">Trail buffer: <strong class="cushion-note">+' + plan.finalBuffer + ' meal(s)</strong></span><div class="buffer-btns">' + bufBtns("final", plan.finalBuffer) + '</div></div>';
  html += '<div class="box-total"><div class="box-total-main"><span>' + plan.finalTotal + ' meals total</span><span>' + Math.round(plan.finalBoxMiles*10)/10 + 'mi</span></div><div class="box-total-note">' + plan.finalBase + ' calculated + ' + plan.finalBuffer + ' buffer</div></div>';
  html += '</div>';

  html += '<div class="action-bar">';
  html += '<button class="btn-primary" onclick="openDownloadModal()">Download my plan (PDF)</button>';
  html += '<button class="btn-secondary" onclick="openBookingModal()">Book this plan</button>';
  html += '</div>';

  el.innerHTML = html;
}

  if (!currentPlan) return;
  document.getElementById("modalContent").innerHTML =
    '<h3>Get your resupply plan</h3>' +
    '<p>Enter your email to download a PDF summary of your plan.</p>' +
    '<input type="email" id="modalEmail" placeholder="your@email.com">' +
    '<div class="modal-error" id="modalError">Please enter a valid email address.</div>' +
    '<div class="modal-actions">' +
    '<button class="btn-primary" onclick="submitEmail()">Download PDF</button>' +
    '<button class="btn-secondary" onclick="closeModal()">Cancel</button>' +
    '</div>';
  document.getElementById("modalOverlay").style.display = "flex";
}

    '<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #f3f4f6"><span>Food</span><span style="color:#666">Billed at exact cost</span></div>' +

    '</div>' +

  document.getElementById("modalOverlay").style.display = "flex";
}

function closeModal() {
  document.getElementById("modalOverlay").style.display = "none";
}

async function submitEmail() {
  var email = document.getElementById("modalEmail").value.trim();
  if (!email || !email.includes("@")) {
    document.getElementById("modalError").style.display = "block";
    return;
  }
  document.getElementById("modalError").style.display = "none";
  var btn = document.querySelector("#modalContent .btn-primary");
  btn.textContent = "One moment...";
  btn.disabled = true;

  var p = currentPlan;
  var boxBreakdown = p.boxes.map(function(b, i) {
    var lines = ["Box " + (i+1) + ": " + b.s.name, "  Arrive: Day " + b.arrivalDay + " - " + fmtDate(b.arrivalDate), "  True miles: " + b.boxMiles + "mi", "  Base meals: " + b.baseMeals, "  Buffer: +" + b.buffer, "  Total: " + b.totalMeals];
    return lines.join("\n");
  }).join("\n\n");

  var notificationBody = [
    "=== NEW JMT RESUPPLY LEAD ===", "",
    "Email: " + email, "Submitted: " + fmtDate(new Date()), "",
    "--- TRIP OVERVIEW ---",
    "Direction: " + (p.sobo?"SOBO":"NOBO"),
    "Route: " + p.en.name + " to " + p.ex.name,
    "Start: " + fmtDate(p.startDate), "Finish: " + fmtDate(p.endDate),
    "Trip length: " + p.totalDays + " days",
    "JMT miles: " + p.jmtMilesCovered,
    "True miles: " + p.totalTrueMiles,
    "Pace: " + p.pace + " mi/day",
    "Service fee: $" + p.serviceFee,
    "Deposit: $" + Math.round(p.serviceFee/2), "",
    "--- BOX BREAKDOWN ---", boxBreakdown, "",
    "Final carry to " + p.ex.name + ": " + p.finalTotal + " meals (" + p.finalBase + " calc + " + p.finalBuffer + " buffer)", "",
    "--- WARNINGS ---", p.warnings.length ? p.warnings.join("\n") : "None"
  ].join("\n");

  var reqs = [];
  if (CK_FORM_ID !== "YOUR_CK_FORM_ID_HERE") {
    reqs.push(fetch("https://api.convertkit.com/v1/forms/" + CK_FORM_ID + "/subscribe", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({api_key: CK_API_KEY, email: email, fields: {plan_summary: (p.sobo?"SOBO":"NOBO") + " " + p.en.name + " to " + p.ex.name + " " + p.totalDays + " days"}})
    }).catch(function(){}));
  }
  if (FORMSPREE_URL !== "YOUR_FORMSPREE_URL_HERE") {
    reqs.push(fetch(FORMSPREE_URL, {
      method: "POST", headers: {"Content-Type":"application/json","Accept":"application/json"},
      body: JSON.stringify({_subject: "New JMT lead - " + (p.sobo?"SOBO":"NOBO") + " " + fmtDate(p.startDate) + " - " + email, email: email, plan: notificationBody})
    }).catch(function(){}));
  }
  await Promise.allSettled(reqs);

  document.getElementById("modalContent").innerHTML =
    '<div style="text-align:center;padding:1rem 0">' +
    '<p style="color:#166534;font-weight:500;font-size:14px;margin-bottom:8px">You are all set!</p>' +
    '<p style="color:#666;font-size:13px;margin-bottom:1rem">Your plan is downloading now.</p>' +
    '<button class="btn-secondary" onclick="closeModal()" style="width:100%">Close</button>' +
    '</div>';

  generatePDF();
}

function generatePDF() {
  if (!currentPlan) return;
  var p = currentPlan;
  var rows = "";
  for (var i = 0; i < p.boxes.length; i++) {
    var b = p.boxes[i];
    rows += "<tr style='background:" + (i%2===0?"#f8f9fa":"#fff") + "'>";
    rows += "<td style='padding:8px 12px;font-weight:500'>Box " + (i+1) + ": " + b.s.name + "</td>";
    rows += "<td style='padding:8px 12px'>Day " + b.arrivalDay + " - " + fmtDate(b.arrivalDate) + "</td>";
    rows += "<td style='padding:8px 12px'>" + b.baseMeals + "</td>";
    rows += "<td style='padding:8px 12px;color:#2563eb'>+" + b.buffer + "</td>";
    rows += "<td style='padding:8px 12px;font-weight:500'>" + b.totalMeals + "</td>";
    rows += "</tr>";
  }
  rows += "<tr style='background:#f0f7f0;font-weight:500'>";
  rows += "<td style='padding:8px 12px'>Final carry to " + p.ex.name + "</td>";
  rows += "<td style='padding:8px 12px'>" + fmtDate(p.endDate) + "</td>";
  rows += "<td style='padding:8px 12px'>" + p.finalBase + "</td>";
  rows += "<td style='padding:8px 12px;color:#2563eb'>+" + p.finalBuffer + "</td>";
  rows += "<td style='padding:8px 12px;font-weight:500'>" + p.finalTotal + "</td>";
  rows += "</tr>";

  var css = "body{font-family:Arial,sans-serif;font-size:13px;color:#1a1a1a;margin:0;padding:32px}h1{font-size:22px;color:#1a4a1a;margin-bottom:4px}.subtitle{font-size:13px;color:#666;margin-bottom:24px}.stats{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:24px}.stat-label{font-size:11px;color:#888;text-transform:uppercase}.stat-value{font-size:20px;font-weight:700;color:#1a4a1a}.stat-sub{font-size:11px;color:#aaa}.section{margin-bottom:24px}.section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#555;margin-bottom:8px;border-bottom:1px solid #ddd;padding-bottom:4px}table{width:100%;border-collapse:collapse;font-size:12px}th{background:#1a4a1a;color:#fff;padding:8px 12px;text-align:left;font-size:11px;text-transform:uppercase}td{border-bottom:1px solid #eee}.footer{margin-top:32px;font-size:11px;color:#999;border-top:1px solid #eee;padding-top:12px}.logo{font-size:18px;font-weight:700;color:#1a4a1a}.note{font-size:11px;color:#888;margin-top:6px}";

  var pdfHtml = "<!DOCTYPE html><html><head><meta charset='utf-8'><title>JMT Resupply Plan</title><style>" + css + "</style></head><body>";
  pdfHtml += "<div class='logo'>One Stop Trail Shop</div><h1>JMT Resupply Plan</h1>";
  pdfHtml += "<div class='subtitle'>" + (p.sobo?"SOBO":"NOBO") + ": " + p.en.name + " to " + p.ex.name + " - Generated " + fmtDate(new Date()) + "</div>";
  pdfHtml += "<div class='stats'>";
  pdfHtml += "<div class='stat'><div class='stat-label'>Start</div><div class='stat-value'>" + fmtDate(p.startDate) + "</div></div>";
  pdfHtml += "<div class='stat'><div class='stat-label'>Finish</div><div class='stat-value'>" + fmtDate(p.endDate) + "</div></div>";
  pdfHtml += "<div class='stat'><div class='stat-label'>Trip length</div><div class='stat-value'>" + p.totalDays + " days</div></div>";
  pdfHtml += "<div class='stat'><div class='stat-label'>JMT miles</div><div class='stat-value'>" + p.jmtMilesCovered + "</div><div class='stat-sub'>trail only</div></div>";
  pdfHtml += "<div class='stat'><div class='stat-label'>True miles</div><div class='stat-value'>" + p.totalTrueMiles + "</div><div class='stat-sub'>incl. side trips</div></div>";
  pdfHtml += "<div class='stat'><div class='stat-label'>Pace</div><div class='stat-value'>" + p.pace + " mi/day</div></div>";
  pdfHtml += "<div class='stat'><div class='stat-label'>Service fee</div><div class='stat-value'>$" + p.serviceFee + "</div><div class='stat-sub'>+ food + shipping</div></div>";
  pdfHtml += "</div>";
  pdfHtml += "<div class='section'><div class='section-title'>Resupply boxes</div>";
  pdfHtml += "<table><thead><tr><th>Box / Destination</th><th>Arrive</th><th>Calculated meals</th><th>Buffer</th><th>Total meals</th></tr></thead><tbody>" + rows + "</tbody></table>";
  pdfHtml += "<div class='note'>Meals use half-day rounding. Buffer meals are extra insurance for slower days or weather.</div></div>";
  if (p.warnings.length) {
    pdfHtml += "<div class='section'><div class='section-title'>Warnings</div>";
    for (var w = 0; w < p.warnings.length; w++) {
      pdfHtml += "<p style='color:#b35900;margin:4px 0'>" + p.warnings[w] + "</p>";
    }
    pdfHtml += "</div>";
  }
  pdfHtml += "<div class='section'><div class='section-title'>Next steps</div>";
  pdfHtml += "<p>1. Contact One Stop Trail Shop at onestoptrailshop.com to book your resupply service.</p>";
  pdfHtml += "<p>2. A 50% deposit ($" + Math.round(p.serviceFee/2) + ") is due at booking. Balance due 3 weeks before your start date.</p>";
  pdfHtml += "<p>3. Food and shipping are billed at exact cost - no markup. You receive all receipts.</p></div>";
  pdfHtml += "<div class='footer'>Generated by One Stop Trail Shop Resupply Planner - onestoptrailshop.com</div>";
  pdfHtml += "<" + "/body><" + "/html>";

  var blob = new Blob([pdfHtml], {type:"text/html"});
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement("a");
  a.href   = url;
  a.download = "JMT_Resupply_Plan.html";
  a.click();
  URL.revokeObjectURL(url);
}

document.getElementById("pace").addEventListener("change", render);

  if (e.target === document.getElementById("modalOverlay")) closeModal();
});

populateSelectors();
